name: Update Last.fm feed

on:
  push:
    branches: [codex/lastfm-feed]
    paths-ignore: [lastfm_data.json]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lastfm-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Read public completed scrobbles
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python recent_tracks.py
      - name: Publish changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lastfm_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update recent Last.fm scrobbles"
            git push
          fi
